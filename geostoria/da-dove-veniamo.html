<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Da dove veniamo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @font-face { font-family: "Libertinus Serif"; src: url("fonts/LibertinusSerif-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "Libertinus Serif"; src: url("fonts/LibertinusSerif-Italic.otf"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Libertinus Serif"; src: url("fonts/LibertinusSerif-Semibold.otf"); font-weight: 600; }
  @font-face { font-family: "Shantell Sans"; src: url("fonts/ShantellSans%5BBNCE,INFM,SPAC,wght%5D.ttf"); font-weight: 300 800; }

  :root {
    --tavolo: #D6D0C4; --inchiostro: #161616; --matita: #6B675F; --rosso: #A9281F; --foglio: #FFFFFF; --mare: #E4E9EB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Libertinus Serif", Georgia, serif; color: var(--inchiostro); font-size: 22px; display: flex; flex-direction: column; overflow: hidden; background: var(--tavolo); }

  /* il bordo del tavolo: titolo e comandi sopra, campo di scrittura a tutta larghezza sotto */
  header { padding: 14px 32px 12px; }
  .riga { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  h1 { font-family: "Shantell Sans", cursive; font-weight: 700; font-size: 30px; margin: 0; line-height: 1; white-space: nowrap; }
  h1 small { font-family: "Libertinus Serif", serif; font-weight: 400; font-size: 20px; color: var(--matita); margin-left: 12px; }
  .comandi { display: flex; gap: 22px; flex-wrap: wrap; }
  .comandi button { font: inherit; font-size: 20px; color: var(--inchiostro); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; white-space: nowrap; }
  .comandi button:hover { text-decoration-color: var(--rosso); }
  .comandi button:focus-visible { outline: 3px solid var(--rosso); outline-offset: 4px; }
  form { display: flex; align-items: baseline; gap: 20px; margin-top: 10px; }
  .campo { flex: 1; max-width: 900px; display: flex; align-items: baseline; gap: 16px; }
  .campo label { font-size: 20px; color: var(--matita); white-space: nowrap; }
  input[type=text] { flex: 1; min-width: 0; font-family: "Shantell Sans", cursive; font-weight: 600; font-size: 32px; padding: 4px 2px 2px; border: 0; border-bottom: 3px solid var(--inchiostro); background: transparent; color: var(--inchiostro); }
  input[type=text]::placeholder { color: #9A958B; font-weight: 400; }
  input[type=text]:focus { outline: none; border-bottom-color: var(--rosso); }
  .invio { font-size: 19px; color: var(--matita); white-space: nowrap; }
  #stato { font-size: 19px; color: var(--matita); min-height: 24px; margin-top: 8px; }
  #stato .trovato { color: var(--inchiostro); }
  #stato .errore { color: var(--rosso); }

  /* la carta */
  #mappa { flex: 1; min-height: 0; margin: 0 32px 24px; box-shadow: 0 10px 24px rgba(40,32,18,.22), 0 2px 4px rgba(40,32,18,.18); background: var(--mare); }
  .leaflet-container { font: inherit; background: var(--mare); }
  .leaflet-tile-pane { filter: sepia(.12); }
  .leaflet-control-zoom a { font-family: "Libertinus Serif", serif; color: var(--inchiostro); }
  .leaflet-control-attribution { font-size: 12px; background: rgba(255,255,255,.7); }
  .modo-clic .leaflet-container { cursor: crosshair; }

  .punto { width: 12px; height: 12px; border-radius: 50%; background: var(--rosso); border: 2.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); margin: -6px 0 0 -6px; }
  .nome { position: absolute; left: 0; top: 0; font-family: "Shantell Sans", cursive; font-weight: 700; color: var(--inchiostro); white-space: nowrap; line-height: 1;
    background: rgba(255,255,255,.88); padding: .12em .3em .1em; border-radius: .2em; box-shadow: 0 1px 2px rgba(40,32,18,.18);
    transition: transform .25s ease, opacity .25s ease; pointer-events: none; }
  .nome.nascosta { opacity: 0; }
  .nome .quanti { font-family: "Libertinus Serif", serif; font-weight: 600; font-size: .5em; color: var(--rosso); margin-left: .3em; vertical-align: .35em; }

  #elenco { position: absolute; right: 48px; bottom: 44px; z-index: 900; background: rgba(255,255,255,.95); border-left: 8px solid var(--tavolo); padding: 12px 18px 14px; max-height: 45%; overflow: auto; font-size: 20px; min-width: 240px; display: none; box-shadow: 0 6px 16px rgba(40,32,18,.2); }
  #elenco.visibile { display: block; }
  #elenco h2 { font-family: "Shantell Sans", cursive; font-size: 22px; margin: 0 0 8px; font-weight: 600; }
  #elenco ol { margin: 0; padding-left: 26px; }
  #elenco li b { color: var(--rosso); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { .nome { transition: none; } }
  @media (max-width: 1000px) { header { padding: 12px 16px; } form { flex-wrap: wrap; } #mappa { margin: 0 16px 16px; } }
</style>
</head>
<body>

<header>
  <div class="riga">
    <h1>Da dove veniamo</h1>
    <div class="comandi">
      <button type="button" id="vicino">Vicino a Bagheria</button>
      <button type="button" id="annulla">Annulla l'ultimo</button>
      <button type="button" id="elencoBtn">Elenco</button>
      <button type="button" id="foto">Salva la foto</button>
      <button type="button" id="salva">Salva l'elenco</button>
      <button type="button" id="carica">Carica un elenco</button>
      <button type="button" id="azzera">Azzera</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </div>
  <form id="modulo" autocomplete="off">
    <div class="campo">
      <label for="luogo">Un luogo che conta per te</label>
      <input type="text" id="luogo" placeholder="Bagheria, Cefalù, Bucarest, Tunisi…" aria-describedby="stato">
    </div>
    <div class="invio">Invio per metterlo sulla carta</div>
  </form>
  <div id="stato">La carta parte da Bagheria e si allarga da sola, un luogo alla volta.</div>
</header>

<div id="mappa"></div>
<aside id="elenco"><h2>I luoghi della classe</h2><ol id="lista"></ol></aside>

<script>
const q = new URLSearchParams(location.search);
const CHIAVE = "da-dove-veniamo";
const BAGHERIA = [38.0785, 13.5081];

const mappa = L.map("mappa", { zoomControl: true, zoomSnap: .25, maxZoom: 16 }).setView(BAGHERIA, 13);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_{s}/MapServer/tile/{z}/{y}/{x}";
L.tileLayer(ESRI.replace("{s}", "Base"), { attribution: "Esri, HERE, Garmin, OpenStreetMap", maxZoom: 16, crossOrigin: true }).addTo(mappa);
L.tileLayer(ESRI.replace("{s}", "Reference"), { maxZoom: 16, crossOrigin: true, pane: "shadowPane" }).addTo(mappa);

let luoghi = [];               // { chiave, nome, lat, lon, quanti }
const marcatori = new Map();   // chiave -> marker
const stato = document.getElementById("stato");
const campo = document.getElementById("luogo");

function corpo(quanti) { return Math.min(24 + (quanti - 1) * 8, 72); }

function icona(l) {
  const html = `<div class="punto"></div><div class="nome" data-chiave="${l.chiave}" style="font-size:${corpo(l.quanti)}px">${l.nome}${l.quanti > 1 ? `<span class="quanti">×${l.quanti}</span>` : ""}</div>`;
  return L.divIcon({ html, className: "", iconSize: [0, 0], iconAnchor: [0, 0] });
}
function disegna(l) {
  if (marcatori.has(l.chiave)) marcatori.get(l.chiave).setIcon(icona(l));
  else marcatori.set(l.chiave, L.marker([l.lat, l.lon], { icon: icona(l), keyboard: false, interactive: false }).addTo(mappa));
  sistemaEtichette();
}

/* anti-sovrapposizione: i luoghi con più persone scelgono per primi; gli altri provano otto posizioni attorno al punto */
function sistemaEtichette() {
  const occupati = luoghi.map(l => { const p = mappa.latLngToContainerPoint([l.lat, l.lon]); return { x: p.x - 8, y: p.y - 8, w: 16, h: 16 }; });
  const ord = [...luoghi].sort((a, b) => b.quanti - a.quanti);
  const R = mappa.getContainer().getBoundingClientRect();
  for (const l of ord) {
    const m = marcatori.get(l.chiave); if (!m) continue;
    const el = m.getElement()?.querySelector(".nome"); if (!el) continue;
    const p = mappa.latLngToContainerPoint([l.lat, l.lon]);
    const w = el.offsetWidth, h = el.offsetHeight;
    const tentativi = [[10, -h / 2], [10, -h - 8], [10, 8], [-w - 10, -h / 2], [-w / 2, -h - 12], [-w / 2, 12], [-w - 10, -h - 8], [-w - 10, 8]];
    let scelto = null;
    for (const [dx, dy] of tentativi) {
      const box = { x: p.x + dx, y: p.y + dy, w, h };
      const libero = !occupati.some(o => box.x < o.x + o.w && box.x + box.w > o.x && box.y < o.y + o.h && box.y + box.h > o.y)
        && box.x >= 0 && box.y >= 0 && box.x + w <= R.width && box.y + h <= R.height;
      if (libero) { scelto = [dx, dy]; break; }
    }
    if (!scelto) { el.classList.add("nascosta"); continue; }
    el.classList.remove("nascosta");
    el.style.transform = `translate(${scelto[0]}px, ${scelto[1]}px)`;
    occupati.push({ x: p.x + scelto[0], y: p.y + scelto[1], w, h });
  }
}
mappa.on("zoomend moveend resize", sistemaEtichette);
document.fonts.ready.then(() => requestAnimationFrame(sistemaEtichette));

function inquadra() {
  if (!luoghi.length) { mappa.flyTo(BAGHERIA, 13); return; }
  const punti = luoghi.map(l => [l.lat, l.lon]); punti.push(BAGHERIA);
  const b = L.latLngBounds(punti);
  if (b.getNorthEast().equals(b.getSouthWest())) { mappa.flyTo(punti[0], 13, { duration: 1 }); return; }
  mappa.flyToBounds(b.pad(0.3), { maxZoom: 13, duration: 1.6 });
}

function aggiungi(nome, lat, lon) {
  const chiave = nome.toLowerCase();
  let l = luoghi.find(x => x.chiave === chiave);
  if (l) l.quanti += 1; else { l = { chiave, nome, lat, lon, quanti: 1 }; luoghi.push(l); }
  disegna(l); inquadra(); salvaLocale(); aggiornaElenco();
  return l;
}

function normalizza(nomeCompleto) {
  const pezzi = nomeCompleto.split(",").map(s => s.trim());
  return pezzi[0].length > 2 && !/^\d/.test(pezzi[0]) ? pezzi[0] : (pezzi[1] || pezzi[0]);
}

async function cerca(testo) {
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=it&viewbox=11.5,36.0,16.5,39.0&bounded=0&q=" + encodeURIComponent(testo);
  const r = await fetch(url, { headers: { "Accept": "application/json" } });
  if (!r.ok) throw new Error("rete");
  return (await r.json())[0] || null;
}

let attesaClic = null;
document.getElementById("modulo").addEventListener("submit", async ev => {
  ev.preventDefault();
  const testo = campo.value.trim(); if (!testo) return;
  stato.innerHTML = `cerco «${testo}»…`;
  try {
    const ris = await cerca(testo);
    if (!ris) { attesaClic = testo; document.body.classList.add("modo-clic"); stato.innerHTML = `<span class="errore">«${testo}» non trovato.</span> Clicca sulla carta dove sta, oppure riscrivilo (Esc per rinunciare).`; campo.value = ""; return; }
    const nome = normalizza(ris.display_name);
    const l = aggiungi(nome, +ris.lat, +ris.lon);
    stato.innerHTML = `<span class="trovato">${nome}</span>, ${ris.display_name.split(",").slice(1, 3).join(",").trim()}${l.quanti > 1 ? `. Ora sono ${l.quanti}.` : "."}`;
  } catch (e) {
    attesaClic = testo; document.body.classList.add("modo-clic");
    stato.innerHTML = `<span class="errore">Niente rete per la ricerca.</span> Clicca sulla carta dove sta «${testo}».`;
  }
  campo.value = ""; campo.focus();
});

mappa.on("click", ev => {
  if (!attesaClic) return;
  const l = aggiungi(attesaClic, ev.latlng.lat, ev.latlng.lng);
  stato.innerHTML = `<span class="trovato">${l.nome}</span>, messo a mano.`;
  attesaClic = null; document.body.classList.remove("modo-clic"); campo.focus();
});

document.getElementById("vicino").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (b.dataset.stato === "vicino") { b.dataset.stato = ""; b.textContent = "Vicino a Bagheria"; inquadra(); return; }
  const vicini = luoghi.filter(l => mappa.distance([l.lat, l.lon], BAGHERIA) < 80000).map(l => [l.lat, l.lon]);
  vicini.push(BAGHERIA);
  mappa.flyToBounds(L.latLngBounds(vicini).pad(0.4), { maxZoom: 12, duration: 1.4 });
  b.dataset.stato = "vicino"; b.textContent = "Tutti i luoghi";
});
document.getElementById("annulla").addEventListener("click", () => {
  const ultimo = luoghi[luoghi.length - 1]; if (!ultimo) return;
  if (ultimo.quanti > 1) { ultimo.quanti -= 1; disegna(ultimo); }
  else { mappa.removeLayer(marcatori.get(ultimo.chiave)); marcatori.delete(ultimo.chiave); luoghi.pop(); }
  inquadra(); salvaLocale(); aggiornaElenco();
  stato.textContent = `Tolto: ${ultimo.nome}.`; campo.focus();
});

function aggiornaElenco() {
  const ord = [...luoghi].sort((a, b) => b.quanti - a.quanti || a.nome.localeCompare(b.nome));
  document.getElementById("lista").innerHTML = ord.map(l => `<li>${l.nome}${l.quanti > 1 ? ` <b>×${l.quanti}</b>` : ""}</li>`).join("");
}
document.getElementById("elencoBtn").addEventListener("click", () => document.getElementById("elenco").classList.toggle("visibile"));

function salvaLocale() { try { localStorage.setItem(CHIAVE, JSON.stringify(luoghi)); } catch (e) {} }
function caricaLocale() { try { const s = localStorage.getItem(CHIAVE); if (s) { luoghi = JSON.parse(s); luoghi.forEach(disegna); aggiornaElenco(); inquadra(); } } catch (e) {} }

function scarica(nome, contenuto, tipo) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([contenuto], { type: tipo })); a.download = nome; a.click();
}
const oggi = new Date().toISOString().slice(0, 10);
document.getElementById("salva").addEventListener("click", () => {
  scarica(`da-dove-veniamo-${oggi}.json`, JSON.stringify({ data: oggi, luoghi }, null, 2), "application/json");
  stato.textContent = "Elenco salvato nei download.";
});
document.getElementById("carica").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if (!f) return;
  const d = JSON.parse(await f.text());
  marcatori.forEach(m => mappa.removeLayer(m)); marcatori.clear();
  luoghi = d.luoghi || []; luoghi.forEach(disegna); aggiornaElenco(); inquadra(); salvaLocale();
  stato.textContent = `Caricati ${luoghi.length} luoghi.`;
});
let azzeraTimer = null;
document.getElementById("azzera").addEventListener("click", ev => {
  const b = ev.currentTarget;
  if (b.dataset.conferma !== "1") {
    b.dataset.conferma = "1"; b.textContent = "Sicuro? Clicca di nuovo";
    stato.textContent = "Azzera cancella tutti i luoghi della classe. Salva prima l'elenco se serve.";
    clearTimeout(azzeraTimer);
    azzeraTimer = setTimeout(() => { b.dataset.conferma = ""; b.textContent = "Azzera"; stato.textContent = ""; }, 5000);
    return;
  }
  clearTimeout(azzeraTimer); b.dataset.conferma = ""; b.textContent = "Azzera";
  marcatori.forEach(m => mappa.removeLayer(m)); marcatori.clear(); luoghi = [];
  salvaLocale(); aggiornaElenco(); inquadra();
  stato.textContent = "Carta azzerata: si riparte da Bagheria."; campo.focus();
});
document.getElementById("foto").addEventListener("click", async () => {
  stato.textContent = "Preparo la foto…";
  try {
    const tela = await html2canvas(document.getElementById("mappa"), { useCORS: true, backgroundColor: "#E4E9EB", scale: 2 });
    tela.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `da-dove-veniamo-${oggi}.png`; a.click(); });
    stato.textContent = "Foto salvata nei download.";
  } catch (e) { stato.innerHTML = '<span class="errore">La foto non è riuscita:</span> usa lo screenshot della LIM.'; }
});

document.addEventListener("keydown", ev => { if (ev.key === "Escape") { attesaClic = null; document.body.classList.remove("modo-clic"); campo.focus(); } });

caricaLocale();
if (q.has("test")) { [["Bagheria",38.0785,13.5081],["Bagheria",38.0785,13.5081],["Bagheria",38.0785,13.5081],["Bagheria",38.0785,13.5081],["Palermo",38.1157,13.3615],["Santa Flavia",38.0868,13.5343],["Casteldaccia",38.0553,13.5317],["Altavilla Milicia",38.0432,13.5527],["Cefalù",38.0397,14.0227],["Napoli",40.8518,14.2681],["Bucarest",44.4268,26.1025],["Tunisi",36.8065,10.1815]].forEach(([n,a,o]) => aggiungi(n,a,o)); }
campo.focus();
</script>
<a class="torna-indice" href="index.html" title="Indice di geostoria">← Geostoria</a>
<style>.torna-indice{position:fixed;right:14px;bottom:10px;z-index:99;font:600 14px/1 system-ui,sans-serif;color:#555;text-decoration:none;opacity:0;transition:opacity .25s;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.85)}.torna-indice:hover,.torna-indice:focus,body:hover .torna-indice{opacity:1}</style>
</body>
</html>
