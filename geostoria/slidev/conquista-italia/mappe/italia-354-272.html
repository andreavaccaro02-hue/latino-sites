<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roma conquista l'Italia, 354-272 a.C.</title>
<!--
Mappa animata per la LIM: seconda tappa dell'espansione romana (cap. 7, lez. 1, pp. 366-370; cronologia p. 367; carta p. 368).
Coste e fiumi: Natural Earth 1:10m (pubblico dominio), ritagliati e semplificati; Volturno e via Appia tracciati a mano.
Territori dei popoli ricostruiti in modo approssimativo. File autonomo: funziona anche senza rete.
Animazioni con anime.js 4.5 (MIT, copia locale in lib/): onda da Roma per i nuovi territori, via Appia tracciata, elefante di Pirro sulla rotta.
Comandi: frecce o spazio, pulsanti, linea del tempo, «riproduci». Parametro ?t=N per aprire la tappa N.
-->
<style>
:root{
  --roma:#b8322a; --guerra:#f0b54b; --lapis:#1f4e8c; --ocra:#c8962e; --testo:#1d2430; --grigio:#6b7280;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--testo);
  font-family:Lexend,"Atkinson Hyperlegible",system-ui,sans-serif;overflow:hidden}
.tutto{display:grid;grid-template-columns:57% 43%;height:100vh}
.carta{position:relative;background:linear-gradient(160deg,#e3f0f8,#c9deec)}
svg{width:100%;height:100vh;display:block}
.pannello{display:flex;flex-direction:column;padding:2.4vh 2.2vw 1.8vh 2vw;gap:1.3vh;
  background:linear-gradient(180deg,#fffdf8,#fff)}
.anno{font-size:7vh;font-weight:700;color:var(--roma);line-height:1;letter-spacing:-.01em}
.titolo{font-size:3.9vh;font-weight:600;line-height:1.15}
.testo{font-size:3.1vh;line-height:1.38}
.testo b{color:var(--lapis)}
.domanda{margin-top:auto;font-size:2.65vh;line-height:1.3;border-left:.6vh solid var(--ocra);padding:.7vh 0 .7vh 1vw;color:#4a3a12;background:#faf3e3;border-radius:0 .6vh .6vh 0}
.legenda{display:grid;grid-template-columns:1fr 1fr;gap:.5vh 1vw;font-size:2vh;color:#4b5563}
.legenda span{display:flex;align-items:center;gap:.5vw}
.legenda i{display:inline-block;width:2.6vh;height:1.8vh;border-radius:.4vh;border:1px solid #0002;flex:none}
.tempo{position:relative;height:6.2vh;margin:.4vh .6vw 0}
.binario{position:absolute;left:0;right:0;top:1.3vh;height:.7vh;background:#e5e7eb;border-radius:1vh}
.pieno{position:absolute;left:0;top:1.3vh;height:.7vh;background:var(--roma);border-radius:1vh;transition:width .7s ease}
.tappa{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  background:none;border:none;font:inherit;cursor:pointer;padding:0;color:var(--grigio)}
.tappa i{width:2.6vh;height:2.6vh;border-radius:50%;background:#fff;border:.45vh solid #d1d5db;transition:all .4s}
.tappa b{font-size:1.75vh;font-weight:500;margin-top:.4vh;white-space:nowrap}
.tappa.fatta i{border-color:var(--roma)}
.tappa.ora i{background:var(--roma);border-color:var(--roma);transform:scale(1.25)}
.tappa.ora b{color:var(--roma);font-weight:700}
.comandi{display:flex;gap:.7vw}
.comandi button{flex:1;font:inherit;font-size:2.4vh;padding:.9vh;border-radius:.8vh;border:2px solid var(--lapis);
  background:#fff;color:var(--lapis);cursor:pointer}
.comandi button.play{background:var(--lapis);color:#fff}
.comandi button:disabled{opacity:.35;cursor:default}
.nota{font-size:1.55vh;color:var(--grigio)}
/* mappa */
.reg{stroke:#8a7a5a55;stroke-width:1;transition:fill .9s ease}
.reg.guerra{animation:guerra 1.4s ease-in-out infinite}
@keyframes guerra{50%{fill:#f7d48e}}
.popolo{font-size:17px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;fill:#6f6449;
  paint-order:stroke;stroke:#f6f0e2;stroke-width:3.5px;stroke-linejoin:round;transition:fill .8s,stroke .8s,opacity .8s}
.popolo.romano{fill:#fff;stroke:#8d241e}
.popolo.via{opacity:.25}
.mare{font-size:19px;font-style:italic;fill:#5b7d98;letter-spacing:.12em}
.citta circle{fill:#fff;stroke:var(--testo);stroke-width:1.8}
.citta.greca circle{fill:#dbe8f5;stroke:var(--lapis)}
.citta text{font-size:15px;fill:var(--testo);paint-order:stroke;stroke:#fffdf6;stroke-width:4px;stroke-linejoin:round}
.citta.roma circle{fill:var(--roma);stroke:#fff;stroke-width:2.5}
.citta.roma text{font-size:21px;font-weight:700}
.ev{opacity:0;transition:opacity .6s;pointer-events:none}
.ev.vis{opacity:1}
.batt .anello{fill:none;stroke:var(--ocra);stroke-width:3.5;animation:pulsa 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.batt.sconfitta .anello{stroke:#111}
@keyframes pulsa{0%,100%{transform:scale(.7);opacity:1}50%{transform:scale(1.6);opacity:.35}}
.batt text{font-size:15px;font-weight:700;fill:#6a4300;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
.batt.sconfitta text{fill:#111}
.batt .spade{font-size:17px;stroke:none}
.traccia{fill:none;stroke-linecap:round;stroke-linejoin:round}
.appia{stroke:#7a1f19;stroke-width:4;stroke-dasharray:2 7}
.pirro{stroke:#3d2f8f;stroke-width:4.5}
.etichetta{font-size:15px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
</style>
</head>
<body>
<div class="tutto">
  <div class="carta"><svg id="mappa" viewBox="0 0 777 790" aria-label="Carta dell'Italia antica"></svg></div>
  <div class="pannello">
    <div class="anno" id="anno"></div>
    <div class="titolo" id="titolo"></div>
    <div class="testo" id="testo"></div>
    <div class="domanda" id="domanda"></div>
    <div class="legenda">
      <span><i style="background:var(--roma)"></i>territorio di Roma</span>
      <span><i style="background:repeating-linear-gradient(45deg,#f3c9c3 0 4px,#d9776b 4px 7px)"></i>alleati di Roma</span>
      <span><i style="background:var(--guerra)"></i>in guerra con Roma</span>
      <span><i style="background:#e8dcbc"></i>popoli indipendenti</span>
    </div>
    <div class="tempo" id="tempo"><div class="binario"></div><div class="pieno" id="pieno"></div></div>
    <div class="comandi">
      <button id="indietro">◀</button>
      <button id="play" class="play">▶ riproduci</button>
      <button id="avanti">▶</button>
    </div>
    <div class="nota">Coste reali (Natural Earth) · confini ricostruiti in modo approssimativo · manuale pp. 366-370</div>
  </div>
</div>
<script src="lib/anime.umd.min.js"></script>

// curva morbida (Catmull-Rom) per percorsi e fiumi
function curva(a) {
  const p = a.map(([lo, la]) => P(lo, la));
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

function distanze(k) {                // distanza minima e massima della regione da Roma
  let mn = 1e9, mx = 0;
  for (const [lo, la] of REG[k]) { const [x, y] = P(lo, la); const d = Math.hypot(x - ROMA[0], y - ROMA[1]); mn = Math.min(mn, d); mx = Math.max(mx, d); }

}
let nOnda = 0;
function onda(k, colore, fine) {      // la regione si colora con un cerchio che si allarga da Roma

  const c = el('circle', {cx: ROMA[0], cy: ROMA[1], r: Math.max(0, mn - 6)}, cp);
  const pol = el('polygon', {points: pts(REG[k]), fill: colore, 'clip-path': `url(#${id})`, class: 'onda', stroke: '#8a7a5a55'}, gR);
  gR.insertBefore(pol, gR.children[Object.keys(REG).length]);
  const a = A.animate(c, {r: mx + 10, duration: 500 + (mx - mn) * 5, delay: mn * 3, ease: 'inOutSine', onComplete: () => { fine(); pol.remove(); cp.remove(); }});

}
