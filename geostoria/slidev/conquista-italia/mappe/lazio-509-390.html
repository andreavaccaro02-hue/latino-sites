<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roma e il Lazio, 509-390 a.C.</title>
<!--
Mappa animata per la LIM: prima tappa dell'espansione romana (cap. 7, lez. 1, pp. 364-366).
Coordinate reali delle città (proiezione semplice lon/lat); territori ricostruiti in modo approssimativo,
come le carte del manuale (p. 365). Si usa dentro la slide (layout iframe) o da sola.
Animazioni con anime.js 4.5 (MIT, copia locale in lib/): onda da Roma, battaglie, discesa dei Galli.
Comandi: frecce o spazio, pulsanti, pallini della linea del tempo.
-->
<style>
:root{
  --mare:#d7e7f2; --terra:#f6f1e4; --bordo:#b9ad92; --fiume:#5d93c4;
  --roma:#b8322a; --romac:#e6a39b; --alleati:#3f7f4f; --lapis:#1f4e8c; --ocra:#c8962e;
  --testo:#1d2430; --grigio:#6b7280; --sfondo:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sfondo);color:var(--testo);
  font-family:Lexend, "Atkinson Hyperlegible", system-ui, sans-serif;overflow:hidden}
.tutto{display:grid;grid-template-columns:52% 48%;height:100vh}
svg{width:100%;height:100vh;display:block;background:var(--mare)}
.pannello{display:flex;flex-direction:column;padding:2.2vh 2.4vw 1.6vh 2.2vw;gap:1.4vh}
.anno{font-size:7.5vh;font-weight:700;color:var(--roma);line-height:1}
.titolo{font-size:4.2vh;font-weight:600;line-height:1.15}
.testo{font-size:3.1vh;line-height:1.35}
.testo b{color:var(--lapis)}
.domanda{margin-top:auto;font-size:2.9vh;line-height:1.3;border-left:.6vh solid var(--ocra);padding:.6vh 0 .6vh 1.2vw;color:#4a3a12;background:#faf3e3}
.linea{display:flex;align-items:center;gap:.6vw;margin-top:.6vh}
.linea button.punto{flex:1;border:none;background:#e5e7eb;color:var(--testo);font:inherit;font-size:2.3vh;
  padding:.9vh 0;border-radius:.8vh;cursor:pointer}
.linea button.punto.attivo{background:var(--roma);color:#fff;font-weight:700}
.comandi{display:flex;gap:.8vw}
.comandi button{flex:1;font:inherit;font-size:2.6vh;padding:1vh;border-radius:.8vh;border:2px solid var(--lapis);
  background:#fff;color:var(--lapis);cursor:pointer}
.comandi button:disabled{opacity:.35;cursor:default}
.legenda{display:flex;flex-wrap:wrap;gap:.4vh 1.2vw;font-size:2.1vh;color:var(--grigio)}
.legenda span::before{content:"";display:inline-block;width:2.2vh;height:1.6vh;margin-right:.4vw;vertical-align:-.2vh;border-radius:.3vh;background:var(--c)}
.nota{font-size:1.7vh;color:var(--grigio)}
/* oggetti della mappa */
.reg{stroke:var(--bordo);stroke-width:1.2;transition:fill .7s, opacity .7s}
.popolo{font-size:17px;font-weight:600;fill:#7a6f58;letter-spacing:.06em;text-transform:uppercase;transition:opacity .6s}
.citta circle{fill:#fff;stroke:var(--testo);stroke-width:1.6}
.citta text{font-size:14px;fill:var(--testo);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.citta.roma circle{fill:var(--roma);stroke:#fff;stroke-width:2.2}
.citta.roma text{font-size:19px;font-weight:700}
.evento{transition:opacity .6s}
.nascosto{opacity:0;pointer-events:none}
.dim{opacity:.35}
@keyframes pulsa{0%{r:10}50%{r:22}100%{r:10}}
.battaglia circle.anello{fill:none;stroke:var(--ocra);stroke-width:3;animation:pulsa 1.6s ease-in-out infinite}
.battaglia text{font-size:15px;font-weight:700;fill:#7a4f00;paint-order:stroke;stroke:#fff;stroke-width:4px}
.freccia{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:14 9;animation:scorri 1s linear infinite}
@keyframes scorri{to{stroke-dashoffset:-23}}
</style>
</head>
<body>
<div class="tutto">
  <svg id="mappa" viewBox="0 0 670 720" aria-label="Carta del Lazio antico"></svg>
  <div class="pannello">
    <div class="anno" id="anno"></div>
    <div class="titolo" id="titolo"></div>
    <div class="testo" id="testo"></div>
    <div class="domanda" id="domanda"></div>
    <div class="legenda">
      <span style="--c:var(--roma)">territorio di Roma</span>
      <span style="--c:var(--romac)">conquiste</span>
      <span style="--c:#8fc19a">alleati latini</span>
    </div>
    <div class="linea" id="linea"></div>
    <div class="comandi">
      <button id="indietro">◀ indietro</button>
      <button id="avanti">avanti ▶</button>
    </div>
    <div class="nota">Confini ricostruiti in modo approssimativo · posizioni delle città reali · manuale pp. 364-366</div>
  </div>
</div>
<script src="lib/anime.umd.min.js"></script>
<script>
// ---------- proiezione: lon 11.8-13.3, lat 41.2-42.4 ----------
const K = 600, C = Math.cos(41.8 * Math.PI / 180);
const P = (lon, lat) => [((lon - 11.8) * K * C), ((42.4 - lat) * K)];
const pts = a => a.map(([lo, la]) => P(lo, la).map(n => n.toFixed(1)).join(',')).join(' ');
const svgNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('mappa');
function el(tag, attrs, parent = svg, text) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text) e.textContent = text;
  parent.appendChild(e); return e;
}
function linea(a) { return 'M' + a.map(([lo, la]) => P(lo, la).map(n => n.toFixed(1)).join(',')).join(' L'); }

// ---------- terra: costa tirrenica, il resto è terra ----------
const costa = [[11.80,42.09],[11.96,42.02],[12.07,41.95],[12.20,41.80],[12.25,41.74],[12.33,41.70],[12.41,41.62],
  [12.52,41.53],[12.62,41.44],[12.70,41.44],[12.77,41.41],[12.90,41.33],[13.00,41.25],[13.05,41.22],[13.12,41.25],[13.25,41.28],[13.30,41.27]];
el('polygon', {points: pts([...costa, [13.32,41.27],[13.32,42.42],[11.78,42.42],[11.78,42.09]]), fill: 'var(--terra)', stroke: 'none'});

// ---------- regioni dei popoli ----------
const REG = {
  etruschi: [[11.78,42.42],[11.78,42.09],[11.96,42.02],[12.07,41.95],[12.20,41.80],[12.25,41.74],[12.30,41.76],[12.40,41.80],[12.46,41.87],[12.51,41.95],[12.55,42.05],[12.55,42.15],[12.48,42.30],[12.42,42.42]],
  veio: [[12.20,41.80],[12.25,41.74],[12.30,41.76],[12.40,41.80],[12.46,41.87],[12.51,41.95],[12.55,42.05],[12.55,42.13],[12.42,42.16],[12.28,42.10],[12.16,41.97],[12.14,41.88]],
  sabini: [[12.42,42.42],[12.48,42.30],[12.55,42.15],[12.55,42.05],[12.62,41.99],[12.78,42.02],[12.92,42.10],[12.98,42.42]],
  equi: [[12.78,42.02],[12.92,42.10],[12.98,42.42],[13.32,42.42],[13.32,41.92],[13.10,41.90],[12.95,41.90],[12.86,41.97]],
  ernici: [[12.95,41.90],[13.10,41.90],[13.32,41.92],[13.32,41.62],[13.12,41.66],[13.00,41.72],[12.94,41.80]],
  volsci: [[12.62,41.44],[12.70,41.44],[12.77,41.41],[12.90,41.33],[13.00,41.25],[13.05,41.22],[13.12,41.25],[13.25,41.28],[13.32,41.27],[13.32,41.62],[13.12,41.66],[13.00,41.72],[12.90,41.66],[12.80,41.58],[12.68,41.52]],
  latini: [[12.33,41.70],[12.41,41.62],[12.52,41.53],[12.62,41.44],[12.68,41.52],[12.80,41.58],[12.90,41.66],[13.00,41.72],[12.94,41.80],[12.95,41.90],[12.86,41.97],[12.78,42.02],[12.62,41.99],[12.60,41.92],[12.60,41.83],[12.50,41.76],[12.40,41.72]],
  roma: [[12.25,41.74],[12.30,41.76],[12.40,41.80],[12.46,41.87],[12.51,41.95],[12.55,42.05],[12.62,41.99],[12.60,41.92],[12.60,41.83],[12.50,41.76],[12.40,41.72],[12.33,41.70]],
  algido: [[12.60,41.83],[12.60,41.92],[12.62,41.99],[12.72,41.94],[12.80,41.80],[12.84,41.70],[12.74,41.68],[12.66,41.76]]
};
const fill0 = {etruschi:'#efe6d0', veio:'#efe6d0', sabini:'#f2ead6', equi:'#ece2c8', ernici:'#f0e7cf', volsci:'#ebe0c4', latini:'#f4edd9', roma:'var(--roma)', algido:'transparent'};
const R = {};
for (const k in REG) R[k] = el('polygon', {points: pts(REG[k]), class: 'reg', fill: fill0[k]});
R.algido.setAttribute('stroke', 'none');
// trama per gli alleati
const defs = el('defs', {});
const pat = el('pattern', {id: 'trama', width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)'}, defs);
el('rect', {width: 10, height: 10, fill: '#cfe6d3'}, pat);
el('line', {x1: 0, y1: 0, x2: 0, y2: 10, stroke: '#8fc19a', 'stroke-width': 5}, pat);

// ---------- fiumi ----------
el('path', {d: linea([[12.39,42.42],[12.48,42.30],[12.55,42.15],[12.55,42.05],[12.51,41.95],[12.47,41.90],[12.46,41.86],[12.40,41.80],[12.30,41.76],[12.25,41.74]]),
  fill: 'none', stroke: 'var(--fiume)', 'stroke-width': 4});
el('path', {d: linea([[12.80,41.96],[12.70,41.95],[12.60,41.93],[12.51,41.94]]), fill: 'none', stroke: 'var(--fiume)', 'stroke-width': 2.5});
const tev = P(12.585, 42.20); el('text', {x: tev[0], y: tev[1], 'font-size': 15, fill: 'var(--fiume)', 'font-style': 'italic', transform: `rotate(-62 ${tev[0]} ${tev[1]})`}, svg, 'Tevere');
const mt = P(11.95, 41.62); el('text', {x: mt[0], y: mt[1], 'font-size': 20, fill: '#5d7f9a', 'font-style': 'italic'}, svg, 'mar Tirreno');

// ---------- nomi dei popoli ----------
const POP = {etruschi: ['Etruschi', 12.05, 42.28], sabini: ['Sabini', 12.70, 42.25], equi: ['Equi', 13.08, 42.12],
  ernici: ['Ernici', 13.13, 41.80], volsci: ['Volsci', 13.07, 41.47], latini: ['Latini', 12.66, 41.62]};
const LBL = {};
for (const k in POP) { const [n, lo, la] = POP[k]; const [x, y] = P(lo, la); LBL[k] = el('text', {x, y, class: 'popolo', 'text-anchor': 'middle'}, svg, n); }

// ---------- città ----------
const CITTA = [['Veio',12.40,42.02,'end'],['Fidene',12.53,41.97,'start'],['Ostia',12.29,41.75,'end'],['Tivoli',12.80,41.96,'start'],
  ['Preneste',12.89,41.84,'start'],['Tuscolo',12.71,41.80,'start'],['Aricia',12.67,41.72,'end'],['Lanuvio',12.70,41.67,'end'],
  ['Velletri',12.78,41.69,'start'],['Lavinio',12.47,41.66,'end'],['Ardea',12.54,41.61,'end'],['Anzio',12.63,41.45,'end'],
  ['Satrico',12.80,41.51,'start'],['Terracina',13.25,41.29,'end'],['Anagni',13.16,41.74,'start'],['Cerveteri',12.10,41.99,'start']];
const CT = {};
const gC = el('g', {});
for (const [n, lo, la, an] of CITTA) {
  const [x, y] = P(lo, la); const g = el('g', {class: 'citta'}, gC); CT[n] = g;
  el('circle', {cx: x, cy: y, r: 5}, g);
  el('text', {x: x + (an === 'end' ? -9 : 9), y: y + 5, 'text-anchor': an}, g, n);
}
{ const [x, y] = P(12.48, 41.89); const g = el('g', {class: 'citta roma'}, gC); el('circle', {cx: x, cy: y, r: 9}, g); el('text', {x: x - 14, y: y + 6, 'text-anchor': 'end'}, g, 'Roma'); CT.Roma = g; }

// ---------- eventi: battaglie e frecce ----------
function battaglia(nome, lo, la, dx = 14, an = 'start') {
  const [x, y] = P(lo, la); const g = el('g', {class: 'evento battaglia nascosto'});
  el('circle', {cx: x, cy: y, r: 10, class: 'anello'}, g);
  el('text', {x: x, y: y + 6, 'text-anchor': 'middle', 'font-size': 18}, g, '⚔');
  el('text', {x: x + dx, y: y - 12, 'text-anchor': an}, g, nome); return g;
}
const EV = {
  regillo: battaglia('lago Regillo', 12.73, 41.85, 16),
  algido: battaglia('monte Algido', 12.79, 41.75, 16),
  veio: battaglia('Veio conquistata', 12.40, 42.02, -14, 'end'),
  allia: battaglia('fiume Allia', 12.56, 42.07, 14)
};
const mk = el('marker', {id: 'punta', markerWidth: 16, markerHeight: 16, refX: 8, refY: 8, orient: 'auto', markerUnits: 'userSpaceOnUse'}, defs);
el('path', {d: 'M0,0 L16,8 L0,16 z', fill: '#6b4a1a'}, mk);
EV.galli = el('path', {d: linea([[12.48,42.42],[12.53,42.25],[12.56,42.12],[12.545,42.00],[12.51,41.935]]), class: 'evento freccia nascosto', stroke: '#6b4a1a', 'marker-end': 'url(#punta)'});
{ const [x, y] = P(12.62, 42.33); EV.galliT = el('text', {x, y, class: 'evento nascosto', 'font-size': 17, 'font-weight': 700, fill: '#6b4a1a'}, svg, 'Galli Sènoni'); }
{ const [x, y] = P(12.48, 41.89); EV.fuoco = el('text', {x: x + 12, y: y - 12, class: 'evento nascosto', 'font-size': 26}, svg, '🔥'); }

// ---------- tappe ----------
const TAPPE = [
  {anno: '509 a.C.', titolo: 'Nasce la repubblica',
   testo: 'Roma controlla un piccolo territorio fra il <b>Tevere</b> e il mare. Intorno: <b>Latini</b>, Etruschi, Sabini e, sulle montagne, Equi e Volsci.',
   dom: 'Quanto è grande Roma rispetto ai popoli intorno?', stato: {}},
  {anno: '496 a.C.', titolo: 'Battaglia del lago Regillo',
   testo: 'Le città della <b>Lega latina</b> provano a sganciarsi da Roma. Roma le affronta presso <b>Tuscolo</b> e vince.',
   dom: 'Chi sono i nemici di Roma in questa battaglia?', stato: {regillo: 1}},
  {anno: '493 a.C.', titolo: 'Il foedus Cassianum',
   testo: 'Pace con i Latini: un <b>trattato alla pari</b>. Esercito comune contro i nemici, bottino diviso in parti uguali.',
   dom: 'Perché Roma sceglie un’alleanza invece di conquistare i Latini?', stato: {alleati: 1}},
  {anno: '458 a.C.', titolo: 'Monte Algido',
   testo: 'Gli <b>Equi</b> e i <b>Volsci</b> scendono dalle montagne a razziare. Al monte Algido li vince <b>Cincinnato</b>, nominato dittatore.',
   dom: 'Che cosa fa Cincinnato dopo la vittoria? (p. 365)', stato: {alleati: 1, algido: 1}},
  {anno: '396 a.C.', titolo: 'La conquista di Veio',
   testo: 'Dopo dieci anni di guerra <b>Furio Camillo</b> prende Veio, la città etrusca oltre il Tevere. Le sue terre diventano romane.',
   dom: 'Perché Veio era così importante? Pensa al fiume e al sale.', stato: {alleati: 1, algido: 1, veio: 1}},
  {anno: '390 a.C.', titolo: 'I Galli a Roma',
   testo: 'I <b>Galli Sènoni</b> scendono da nord, vincono sul fiume <b>Allia</b> e saccheggiano Roma. Se ne vanno dopo un riscatto.',
   dom: 'Perché il giorno dell’Allia diventa un «giorno infausto»?', stato: {alleati: 1, algido: 1, veio: 1, galli: 1}}
];

const linea_ = document.getElementById('linea');
TAPPE.forEach((t, i) => { const b = document.createElement('button'); b.className = 'punto'; b.textContent = t.anno.replace(' a.C.', ''); b.onclick = () => vai(i); linea_.appendChild(b); });

let ora = 0, prec = null;
// ---------- animazioni (anime.js, in lib/) ----------
const A = window.anime || null, ROMA = P(12.48, 41.89), corsa = [];
function fermaTutto() { while (corsa.length) { try { corsa.pop().pause(); } catch (e) {} } document.querySelectorAll('.onda').forEach(x => x.remove()); }
function onda(k, colore, fine) {   // la regione si colora con un cerchio che si allarga da Roma
  let mn = 1e9, mx = 0;
  for (const [lo, la] of REG[k]) { const [x, y] = P(lo, la); const d = Math.hypot(x - ROMA[0], y - ROMA[1]); mn = Math.min(mn, d); mx = Math.max(mx, d); }
  const id = 'onda' + Math.random().toString(36).slice(2);
  const cp = el('clipPath', {id, class: 'onda'}, defs); const c = el('circle', {cx: ROMA[0], cy: ROMA[1], r: Math.max(0, mn - 6)}, cp);
  const pol = el('polygon', {points: pts(REG[k]), fill: colore, 'clip-path': `url(#${id})`, class: 'onda reg'});
  svg.insertBefore(pol, R[k].nextSibling);
  corsa.push(A.animate(c, {r: mx + 10, duration: 900 + (mx - mn) * 4, ease: 'inOutSine', onComplete: () => { fine(); pol.remove(); cp.remove(); }}));
}
function scoppio(e, ritardo) {
  e.style.transformBox = 'fill-box'; e.style.transformOrigin = 'center'; e.style.opacity = 0;
  corsa.push(A.animate(e, {opacity: [0, 1], scale: [.2, 1], duration: 700, delay: ritardo, ease: 'outBack(2.2)'}));
}
// la freccia dei Galli si rivela con una maschera che si disegna
const mGalli = el('mask', {id: 'mGalli', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 670, height: 720}, defs);
const mGalliP = el('path', {d: EV.galli.getAttribute('d'), fill: 'none', stroke: '#fff', 'stroke-width': 30, 'stroke-linecap': 'round'}, mGalli);
EV.galli.setAttribute('mask', 'url(#mGalli)');
function vai(i) {
  fermaTutto();
  const da = prec === null ? null : TAPPE[prec].stato;
  ora = Math.max(0, Math.min(TAPPE.length - 1, i));
  const avanti = A && da && ora === prec + 1; prec = ora;
  const t = TAPPE[ora], s = t.stato;
  [EV.regillo, EV.algido, EV.veio, EV.allia, EV.galliT, EV.fuoco].forEach(e => { e.style.opacity = ''; e.style.transform = ''; });
  const nG = mGalliP.getTotalLength(); mGalliP.style.strokeDasharray = nG; mGalliP.style.strokeDashoffset = 0;
  document.getElementById('anno').textContent = t.anno;
  document.getElementById('titolo').textContent = t.titolo;
  document.getElementById('testo').innerHTML = t.testo;
  document.getElementById('domanda').textContent = t.dom;
  [...linea_.children].forEach((b, j) => b.classList.toggle('attivo', j === ora));
  document.getElementById('indietro').disabled = ora === 0;
  document.getElementById('avanti').disabled = ora === TAPPE.length - 1;
  // territori
  const fL = s.alleati ? 'url(#trama)' : fill0.latini, fV = s.veio ? 'var(--romac)' : fill0.veio;
  if (avanti && s.alleati && !da.alleati) onda('latini', fL, () => R.latini.setAttribute('fill', fL)); else R.latini.setAttribute('fill', fL);
  if (avanti && s.veio && !da.veio) onda('veio', fV, () => R.veio.setAttribute('fill', fV)); else R.veio.setAttribute('fill', fV);
  LBL.latini.textContent = s.alleati ? 'Latini alleati' : 'Latini';
  LBL.equi.classList.toggle('dim', !!s.algido); LBL.volsci.classList.toggle('dim', !!s.algido);
  // eventi: solo quelli della tappa corrente lampeggiano
  EV.regillo.classList.toggle('nascosto', ora !== 1);
  EV.algido.classList.toggle('nascosto', ora !== 3);
  EV.veio.classList.toggle('nascosto', ora !== 4);
  const g = ora === 5;
  [EV.allia, EV.galli, EV.galliT, EV.fuoco].forEach(e => e.classList.toggle('nascosto', !g));
  if (!avanti) return;
  if (ora === 1) scoppio(EV.regillo, 300);
  if (ora === 3) scoppio(EV.algido, 300);
  if (ora === 4) scoppio(EV.veio, 1200);
  if (ora === 5) {   // i Galli scendono, vincono sull'Allia, Roma brucia
    EV.allia.style.opacity = 0; EV.fuoco.style.opacity = 0;
    corsa.push(A.animate(EV.galliT, {opacity: [0, 1], duration: 600, ease: 'outQuad'}));
    corsa.push(A.animate(mGalliP, {strokeDashoffset: [nG, 0], duration: 2600, delay: 300, ease: 'inOutSine'}));
    scoppio(EV.allia, 1800); scoppio(EV.fuoco, 3000);
  }
}
document.getElementById('avanti').onclick = () => vai(ora + 1);
document.getElementById('indietro').onclick = () => vai(ora - 1);
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); (ora === TAPPE.length - 1 ? __passa(1) : vai(ora + 1)); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); (ora === 0 ? __passa(-1) : vai(ora - 1)); }
});
const q = new URLSearchParams(location.search).get('t');
vai(q ? +q : 0);

// ponte con Slidev: la pagina prende i tasti quando la sua slide è visibile;
// avanti dopo l'ultima tappa e indietro dalla prima passano alle slide. Non attivo nella vista relatore.
function __restituisci() {
  try { if (window.frameElement) window.frameElement.blur(); window.parent.focus(); } catch (e) {}
}
function __passa(dir) {
  try { const n = window.parent !== window && window.parent.__slidev__ && window.parent.__slidev__.nav; if (n) { dir > 0 ? n.next() : n.prev(); __restituisci(); } } catch (e) {}
}
(function () {
  if (window.parent === window) return;
  let relatore = false; try { relatore = window.parent.location.pathname.includes('presenter'); } catch (e) {}
  if (relatore) return;
