<title>338 a.C., che cosa fare dei vinti</title>
<!--
Mappa interattiva per la LIM: le decisioni del senato dopo la guerra latina, Livio VIII 14 (cap. 7, lezz. 1-2, pp. 367 e 374-375).
Città nominate da Livio: Lanuvio, Aricia, Nomento, Pedo, Tuscolo (cittadinanza); Velletri, Anzio (puniti, coloni); Tivoli, Preneste (territorio tolto);
Capua, Cuma, Suessula, Fondi, Formia (cittadinanza senza voto). «Altri Latini»: Livio non li nomina; qui, per esempio, le colonie latine
già esistenti (Ardea, Cora, Norba, Setia, Signia, Circei). Coste: Natural Earth 1:10m. Comandi: frecce, pulsanti, clic sulle città. ?t=N.
-->

:root{--roma:#b8322a;--sv:#e8958c;--pun:#2b2b2b;--lat:#8a7f68;--lapis:#1f4e8c;--ocra:#c8962e;--testo:#1d2430;--grigio:#6b7280}

.tutto{display:grid;grid-template-columns:57% 43%;height:100vh}

.pannello{display:flex;flex-direction:column;padding:2.4vh 2.2vw 1.8vh 2vw;gap:1.2vh;background:linear-gradient(180deg,#fffdf8,#fff)}

.legenda{display:grid;grid-template-columns:1fr 1fr;gap:.4vh 1vw;font-size:1.95vh;color:#4b5563}
.legenda span{display:flex;align-items:center;gap:.5vw}
.legenda i{display:inline-block;width:1.9vh;height:1.9vh;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.tempo{display:flex;gap:.5vw}
.tempo button{flex:1;font:inherit;font-size:1.9vh;padding:.8vh 0;border:none;border-radius:.7vh;background:#e5e7eb;color:var(--testo);cursor:pointer}
.tempo button.ora{background:var(--roma);color:#fff;font-weight:700}
.comandi{display:flex;gap:.7vw}
.comandi button{flex:1;font:inherit;font-size:2.4vh;padding:.9vh;border-radius:.8vh;border:2px solid var(--lapis);background:#fff;color:var(--lapis);cursor:pointer}
.comandi button:disabled{opacity:.35;cursor:default}
.nota{font-size:1.5vh;color:var(--grigio)}
.citta{cursor:pointer}
.citta circle{transition:fill .8s,stroke .8s,r .5s;stroke:#fff;stroke-width:.7}
.citta text{font-size:3.9px;paint-order:stroke;stroke:#fffdf6;stroke-width:1.2px;stroke-linejoin:round;fill:var(--testo)}
.citta.sel circle{stroke:var(--ocra);stroke-width:1.3}
.legame{stroke-linecap:round;transition:opacity .9s,stroke .9s}
.anello{fill:none;stroke-width:.8;transition:opacity .8s}
</style>

const COL = {R: 'var(--roma)', S: 'var(--sv)', X: 'var(--pun)', T: 'url(#tr)', L: 'url(#tr)'};

];
const tempo = document.getElementById('tempo');
const bt = TAPPE.map((t, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.onclick = () => vai(i); tempo.appendChild(b); return b; });
let ora = 0;
function pannello(t) { document.getElementById('sopra').textContent = t.sopra; document.getElementById('titolo').textContent = t.titolo; document.getElementById('testo').innerHTML = t.testo; document.getElementById('domanda').textContent = t.dom; }
function vai(i) {
  ora = Math.max(0, Math.min(TAPPE.length - 1, i)); const t = TAPPE[ora];
  pannello(t); CT.forEach(x => x.g.classList.remove('sel'));
  bt.forEach((b, j) => b.classList.toggle('ora', j === ora));
  document.getElementById('ind').disabled = ora === 0; document.getElementById('av').disabled = ora === TAPPE.length - 1;
  for (const x of CT) {
    const on = t.mostra.includes(x.c[3]);
    x.pt.setAttribute('fill', on ? COL[x.c[3]] : '#fff');
    x.pt.setAttribute('r', on ? 2.1 : 1.6);
    x.anello.setAttribute('opacity', on && x.c[3] === 'X' ? 1 : 0);
  }
  fraLoro.forEach(l => { l.setAttribute('opacity', t.reti ? .75 : 0); });
  versoRoma.forEach(l => l.setAttribute('stroke-width', t.reti ? .5 : .8));
  strada.setAttribute('opacity', t.strada ? 1 : 0);
}
function mostra(c, g) {
  CT.forEach(x => x.g.classList.remove('sel')); g.classList.add('sel');
  pannello({sopra: 'Livio VIII 14', titolo: c[0], testo: c[5], dom: TAPPE[ora].dom});
}
document.getElementById('av').onclick = () => vai(ora + 1);
document.getElementById('ind').onclick = () => vai(ora - 1);
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); (ora === TAPPE.length - 1 ? __passa(1) : vai(ora + 1)); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); (ora === 0 ? __passa(-1) : vai(ora - 1)); }
});
const q = new URLSearchParams(location.search).get('t'); vai(q ? +q : 0);
