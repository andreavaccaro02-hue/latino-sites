<title>L'Egitto, dono del Nilo</title>
<!--
Mappa a tappe per la LIM: cap. 1, lez. 2 §1 e Geostoria «L'Egitto, regione chiusa» (manuale pp. 44-45).
Coste e Nilo (con i rami di Rosetta e Damietta): Natural Earth 1:10m, pubblico dominio. Terra nera, Alto e Basso Egitto
e vie di comunicazione disegnati in modo schematico. Erodoto II 5: l'Egitto è «dono del fiume».
Data dell'unificazione come nel manuale (3200 circa; molti storici dicono 3100 circa).
Comandi: frecce, pulsanti. ?t=N apre la tappa N. Rigenerare con sorgenti/genera.py.
-->
<style>
:root{--roma:#b8322a;--lapis:#1f4e8c;--ocra:#c8962e;--testo:#1d2430;--grigio:#6b7280;--nera:#4f7a2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--testo);font-family:Lexend,"Atkinson Hyperlegible",system-ui,sans-serif;overflow:hidden}
.tutto{display:grid;grid-template-columns:57% 43%;height:100vh}
.carta{background:linear-gradient(160deg,#dcecf6,#c4dbea)}
svg{width:100%;height:100vh;display:block}
.pannello{display:flex;flex-direction:column;padding:2.4vh 2.2vw 1.8vh 2vw;gap:1.2vh;background:linear-gradient(180deg,#fffdf8,#fff)}
.sopra{font-size:2.3vh;font-weight:600;color:var(--grigio);text-transform:uppercase;letter-spacing:.08em}
.titolo{font-size:4.8vh;font-weight:700;color:var(--roma);line-height:1.08}
.testo{font-size:3.05vh;line-height:1.38}
.testo b{color:var(--lapis)}
.testo q{font-style:italic;quotes:"«" "»"}
.domanda{margin-top:auto;font-size:2.7vh;line-height:1.3;border-left:.6vh solid var(--ocra);padding:.7vh 0 .7vh 1vw;color:#4a3a12;background:#faf3e3;border-radius:0 .6vh .6vh 0}
.tempo{display:flex;gap:.5vw}
.tempo button{flex:1;font:inherit;font-size:1.9vh;padding:.8vh 0;border:none;border-radius:.7vh;background:#e5e7eb;color:var(--testo);cursor:pointer}
.tempo button.ora{background:var(--roma);color:#fff;font-weight:700}
.comandi{display:flex;gap:.7vw}
.comandi button{flex:1;font:inherit;font-size:2.4vh;padding:.9vh;border-radius:.8vh;border:2px solid var(--lapis);background:#fff;color:var(--lapis);cursor:pointer}
.comandi button:disabled{opacity:.35;cursor:default}
.nota{font-size:1.5vh;color:var(--grigio)}
.ev{transition:opacity .8s}
.mare{font-size:17px;font-style:italic;fill:#4f7896;letter-spacing:.1em}
.reg{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;fill:#8a6d3b;paint-order:stroke;stroke:#f3e6c8;stroke-width:3.5px;stroke-linejoin:round}
.citta circle{fill:#fff;stroke:var(--testo);stroke-width:1.6}
.citta text{font-size:15.5px;fill:var(--testo);paint-order:stroke;stroke:#fffaf0;stroke-width:4px;stroke-linejoin:round}
.et{font-size:17px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
@keyframes pulsa{50%{opacity:.35}}
.barriera{animation:pulsa 1.6s ease-in-out infinite}
.via{fill:none;stroke:#7a4f12;stroke-width:3;stroke-dasharray:3 6;stroke-linecap:round}
</style>
</head>
