<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La società egizia</title>
<!--
Schema a tappe per la LIM: la società egizia (cap. 1, lez. 2 §2, pp. 46-47). Livelli e ruoli come nel manuale e nel fascicolo L10-1BLS.
Teocrazia: gr. theós «dio» + krátos «potere». Pagamenti in natura: in Egitto non c'è la moneta (p. 47).
Foto: Scriba seduto, Louvre, Wikimedia Commons. Comandi: frecce, pulsanti. ?t=N.
-->
<style>
:root{--roma:#b8322a;--lapis:#1f4e8c;--ocra:#c8962e;--testo:#1d2430;--grigio:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--testo);font-family:Lexend,"Atkinson Hyperlegible",system-ui,sans-serif;overflow:hidden}
.tutto{display:grid;grid-template-columns:57% 43%;height:100vh}
.sx{position:relative;background:linear-gradient(180deg,#fbf6ea,#f1e6cc)}
svg{width:100%;height:100vh;display:block}
.foto{position:absolute;right:2%;top:4%;width:30%;border-radius:1vh;box-shadow:0 .4vh 1.2vh #0003;transition:opacity .8s}
.pannello{display:flex;flex-direction:column;padding:2.4vh 2.2vw 1.8vh 2vw;gap:1.3vh}
.sopra{font-size:2.3vh;font-weight:600;color:var(--grigio);text-transform:uppercase;letter-spacing:.08em}
.titolo{font-size:4.8vh;font-weight:700;color:var(--roma);line-height:1.08}
.testo{font-size:3.05vh;line-height:1.38}
.testo b{color:var(--lapis)}
.domanda{margin-top:auto;font-size:2.7vh;line-height:1.3;border-left:.6vh solid var(--ocra);padding:.7vh 0 .7vh 1vw;color:#4a3a12;background:#faf3e3;border-radius:0 .6vh .6vh 0}
.tempo{display:flex;gap:.5vw}
.tempo button{flex:1;font:inherit;font-size:1.9vh;padding:.8vh 0;border:none;border-radius:.7vh;background:#e5e7eb;color:var(--testo);cursor:pointer}
.tempo button.ora{background:var(--roma);color:#fff;font-weight:700}
.comandi{display:flex;gap:.7vw}
.comandi button{flex:1;font:inherit;font-size:2.4vh;padding:.9vh;border-radius:.8vh;border:2px solid var(--lapis);background:#fff;color:var(--lapis);cursor:pointer}
.comandi button:disabled{opacity:.35;cursor:default}
.nota{font-size:1.5vh;color:var(--grigio)}
.liv{transition:opacity .7s}
.liv path{transition:fill .6s,stroke .6s}
.liv text{font-size:19px;font-weight:700;text-anchor:middle}
.sub{font-size:13.5px !important;font-weight:500 !important}
.ev{transition:opacity .8s}
.fl{fill:none;stroke-width:4;stroke-linecap:round}
.flt{font-size:14px;font-weight:700;paint-order:stroke;stroke:#fbf6ea;stroke-width:4px;stroke-linejoin:round}
</style>
</head>
<body>
<div class="tutto">
  <div class="sx"><svg id="s" viewBox="0 0 600 560" aria-label="La piramide sociale egizia"></svg><img class="foto" id="foto" src="../img/scriba-seduto.jpg" alt="Lo scriba seduto, Louvre"></div>
  <div class="pannello">
    <div class="sopra" id="sopra"></div>
    <div class="titolo" id="titolo"></div>
    <div class="testo" id="testo"></div>
    <div class="domanda" id="domanda"></div>
    <div class="tempo" id="tempo"></div>
    <div class="comandi"><button id="ind">◀ indietro</button><button id="av">avanti ▶</button></div>
    <div class="nota">Schema semplificato · manuale pp. 46-47 · foto: Scriba seduto, Louvre (Wikimedia Commons)</div>
  </div>
</div>
<script>
const NS = 'http://www.w3.org/2000/svg', s = document.getElementById('s');
function el(t, a, p = s, x) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (x != null) e.textContent = x; p.appendChild(e); return e; }
const CX = 250, TOP = 70, H = 105;
// quattro livelli della piramide, dall'alto
const LIV = [
  {n: 'faraone', sub: 'un dio, potere assoluto', c: '#d4a52a'},
  {n: 'visir', sub: 'giustizia, tesoro, tasse, lavori', c: '#c97b3a'},
  {n: 'scribi e sacerdoti', sub: 'scrivono, contano, celebrano', c: '#b8584a'},
  {n: 'contadini, artigiani, soldati', sub: 'la grande maggioranza', c: '#8a6a45'}
];
const half = y => 20 + (y - TOP) * 0.5;
const L = LIV.map((l, i) => {
  const y0 = TOP + i * H, y1 = y0 + H - 6, a = half(y0), b = half(y1);
  const g = el('g', {class: 'liv', opacity: 0});
  const p = el('path', {d: `M${CX - a},${y0} L${CX + a},${y0} L${CX + b},${y1} L${CX - b},${y1} Z`, fill: '#efe3c6', stroke: '#c9b991', 'stroke-width': 2}, g);
  const t = el('text', {x: CX, y: y0 + H / 2 + (i === 0 ? 10 : 0)}, g, l.n);
  const st = el('text', {x: CX, y: y0 + H / 2 + 22, class: 'sub'}, g, i === 0 ? '' : l.sub);
  return {g, p, t, st, l};
});
// flussi della ricchezza (tappa finale)
const F = el('g', {class: 'ev', opacity: 0});
const defs = el('defs', {}); defs.innerHTML = `
  <marker id="pv" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,6 L0,11z" fill="#4f8a2c"/></marker>
  <marker id="pb" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L12,6 L0,11z" fill="#1f4e8c"/></marker>`;
el('path', {d: 'M440,440 C520,400 520,220 380,150', class: 'fl', stroke: '#4f8a2c', 'marker-end': 'url(#pv)'}, F);
el('text', {x: 512, y: 300, class: 'flt', fill: '#4f8a2c', 'text-anchor': 'middle'}, F, 'raccolti');
el('text', {x: 512, y: 318, class: 'flt', fill: '#4f8a2c', 'text-anchor': 'middle'}, F, 'come tasse');
el('path', {d: 'M120,150 C-10,230 -10,400 70,440', class: 'fl', stroke: '#1f4e8c', 'marker-end': 'url(#pb)'}, F);
el('text', {x: 40, y: 286, class: 'flt', fill: '#1f4e8c', 'text-anchor': 'middle'}, F, 'paga');
el('text', {x: 40, y: 304, class: 'flt', fill: '#1f4e8c', 'text-anchor': 'middle'}, F, 'in natura');
const gr = el('g', {class: 'ev', opacity: 0});
el('path', {d: 'M440,155 l0,-26 q18,-24 36,0 l0,26 Z', fill: '#e2c48a', stroke: '#8a6d3b'}, gr);
el('text', {x: 458, y: 180, 'text-anchor': 'middle', class: 'flt', fill: '#8a6d3b'}, gr, 'granai');
const cl = el('text', {x: CX, y: 530, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, fill: '#b8322a', class: 'ev', opacity: 0}, s, 'di solito si resta nella classe in cui si nasce');

const TAPPE = [
  {sopra: 'Teocrazia', titolo: 'Il faraone', testo: 'In cima il <b>faraone</b>: non un uomo che parla con gli dèi, come il re sumero, ma un <b>dio</b> lui stesso, figlio di Ra. Per questo il suo potere è <b>assoluto</b>: è una <b>teocrazia</b>, «potere del dio».', dom: 'Che cosa rischia chi disobbedisce al faraone?', n: 1, att: 0},
  {sopra: 'Il primo ministro', titolo: 'Il visir', testo: 'Il faraone non può fare tutto da solo. Il <b>visir</b> governa per lui: <b>giustizia</b>, <b>tesoro</b>, <b>tasse</b>, <b>lavori pubblici</b> come argini e canali.', dom: 'Perché il visir si occupa anche di canali?', n: 2, att: 1},
  {sopra: 'Il potere della scrittura', titolo: 'Gli scribi', testo: 'Gli <b>scribi</b> sanno scrivere e contare: registrano raccolti, bestiame, tasse, lavoratori. Senza di loro lo Stato non sa che cosa possiede.', dom: 'Guarda lo scriba: che cosa tiene sulle ginocchia?', n: 3, att: 2, foto: 1},
  {sopra: 'Gli dèi e i templi', titolo: 'I sacerdoti', testo: 'I <b>sacerdoti</b> curano i templi e il culto degli dèi. I templi hanno terre, granai, lavoratori: sono anche grandi centri economici.', dom: 'Perché scribi e sacerdoti stanno sullo stesso livello?', n: 3, att: 2},
  {sopra: 'La base', titolo: 'Chi lavora per tutti', testo: '<b>Contadini</b>, <b>artigiani</b>, <b>soldati</b>: la grande maggioranza. I contadini coltivano, e nei mesi della piena lavorano ad argini, canali e cantieri.', dom: 'Che cosa fanno i contadini quando i campi sono sott’acqua?', n: 4, att: 3},
  {sopra: 'Senza moneta', titolo: 'Come gira la ricchezza', testo: 'In Egitto non c’è la moneta. I contadini danno parte del <b>raccolto</b> come tassa; gli scribi registrano; il grano va nei <b>granai</b>; da lì si pagano <b>in natura</b> lavoratori, artigiani e soldati.', dom: 'Che cosa vuol dire «pagare in natura»?', n: 4, att: -1, flussi: 1},
  {sopra: 'Una società immobile', titolo: 'Ognuno al suo posto', testo: 'Di solito si resta nella classe in cui si nasce: il figlio del contadino fa il contadino. Solo saper scrivere apre qualche porta.', dom: 'Perché la scrittura poteva cambiare la vita di una persona?', n: 4, att: -1, classi: 1}
];
const tempo = document.getElementById('tempo');
const bt = TAPPE.map((t, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.onclick = () => vai(i); tempo.appendChild(b); return b; });
let ora = 0;
function vai(i) {
  ora = Math.max(0, Math.min(TAPPE.length - 1, i)); const t = TAPPE[ora];
  for (const k of ['sopra', 'titolo', 'testo']) document.getElementById(k).innerHTML = t[k];
  document.getElementById('domanda').textContent = t.dom;
  bt.forEach((b, j) => b.classList.toggle('ora', j === ora));
  document.getElementById('ind').disabled = ora === 0; document.getElementById('av').disabled = ora === TAPPE.length - 1;
  L.forEach((x, j) => {
    x.g.setAttribute('opacity', j < t.n ? 1 : 0);
    const on = j === t.att;
    x.p.setAttribute('fill', on ? x.l.c : '#efe3c6'); x.p.setAttribute('stroke', on ? x.l.c : '#c9b991');
    x.t.setAttribute('fill', on ? '#fff' : '#1d2430'); x.st.setAttribute('fill', on ? '#fff' : '#4b5563');
  });
  F.setAttribute('opacity', t.flussi ? 1 : 0); gr.setAttribute('opacity', t.flussi ? 1 : 0);
  cl.setAttribute('opacity', t.classi ? 1 : 0);
  document.getElementById('foto').style.opacity = t.foto ? 1 : 0;
}
document.getElementById('av').onclick = () => vai(ora + 1);
document.getElementById('ind').onclick = () => vai(ora - 1);
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); (ora === TAPPE.length - 1 ? __passa(1) : vai(ora + 1)); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); (ora === 0 ? __passa(-1) : vai(ora - 1)); }
});
const q = new URLSearchParams(location.search).get('t'); vai(q ? +q : 0);

// ponte con Slidev (vedi REGOLE-SLIDE.md): tasti alla pagina quando la slide è visibile; oltre i bordi si passa alle slide.
function __passa(dir) {
  try { const n = window.parent !== window && window.parent.__slidev__ && window.parent.__slidev__.nav; if (n) { dir > 0 ? n.next() : n.prev(); } } catch (e) {}
}
(function () {
  if (window.parent === window) return;
  let relatore = false; try { const l = window.parent.location; relatore = (l.pathname + l.hash).includes('presenter'); } catch (e) {}
  if (relatore) return;
  const fe = window.frameElement; let era = false;
  setInterval(() => { const vis = !!fe && fe.getBoundingClientRect().height > 0; if (vis && !era) window.focus(); era = vis; }, 250);
})();
</script>
</body>
</html>
