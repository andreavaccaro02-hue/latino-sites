<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dove succede: l'Egitto dei tre Regni</title>
<!--
Carta animata per la LIM: dove succedono le cose della lezione 2 §3 (manuale pp. 48-52; carta di p. 46, box «Dov'è oggi» e «Luoghi» p. 50).
Coste e fiumi (Nilo, Eufrate, Tigri): Natural Earth 1:10m, pubblico dominio (sorgenti/coste-vicino-oriente.py). Confini dei regni approssimativi,
disegnati a mano sulla carta di p. 50; posizioni delle città reali. Date come nel manuale.
Animazioni con anime.js 4.5 (MIT, lib/): onde dalle capitali per i territori, frecce che si disegnano, carro e navi lungo le rotte, scoppio a Kadesh.
Solo il passo avanti di una tappa si anima; salti e indietro sono istantanei. Comandi: frecce o spazio, pulsanti; ?t=N apre la tappa N (da 0).
Modello in sorgenti/egitto-regni-mappa-modello.html: rigenerare con sorgenti/genera.py.
-->
<style>
:root{--roma:#b8322a;--lapis:#1f4e8c;--ocra:#c8962e;--testo:#1d2430;--grigio:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--testo);font-family:Lexend,"Atkinson Hyperlegible",system-ui,sans-serif;overflow:hidden}
.tutto{display:grid;grid-template-columns:57% 43%;height:100vh}
.carta{background:linear-gradient(160deg,#dcecf6,#c4dbea)}
svg{width:100%;height:100vh;display:block}
.pannello{display:flex;flex-direction:column;padding:2.4vh 2.2vw 1.8vh 2vw;gap:1.2vh;background:linear-gradient(180deg,#fffdf8,#fff)}
.sopra{font-size:2.3vh;font-weight:600;color:var(--grigio);text-transform:uppercase;letter-spacing:.08em}
.titolo{font-size:4.6vh;font-weight:700;color:var(--roma);line-height:1.08}
.testo{font-size:2.9vh;line-height:1.36}
.testo b{color:var(--lapis)}
.domanda{margin-top:auto;font-size:2.6vh;line-height:1.3;border-left:.6vh solid var(--ocra);padding:.7vh 0 .7vh 1vw;color:#4a3a12;background:#faf3e3;border-radius:0 .6vh .6vh 0}
.tempo{display:flex;gap:.5vw}
.tempo button{flex:1;font:inherit;font-size:1.9vh;padding:.8vh 0;border:none;border-radius:.7vh;background:#e5e7eb;color:var(--testo);cursor:pointer}
.tempo button.ora{background:var(--roma);color:#fff;font-weight:700}
.comandi{display:flex;gap:.7vw}
.comandi button{flex:1;font:inherit;font-size:2.4vh;padding:.9vh;border-radius:.8vh;border:2px solid var(--lapis);background:#fff;color:var(--lapis);cursor:pointer}
.comandi button:disabled{opacity:.35;cursor:default}
.nota{font-size:1.5vh;color:var(--grigio)}
.ev{transition:opacity .6s}
.mare{font-size:14px;font-style:italic;fill:#4f7896;letter-spacing:.1em}
.reg{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;fill:#8a6d3b;paint-order:stroke;stroke:#f3e6c8;stroke-width:3px;stroke-linejoin:round}
.citta circle{fill:#fff;stroke:var(--testo);stroke-width:1.5}
.citta text{font-size:12.5px;fill:var(--testo);paint-order:stroke;stroke:#fffaf0;stroke-width:3.5px;stroke-linejoin:round}
.citta.cap text{font-weight:700}
.et{font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.fr{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.zona{stroke-width:1.2;stroke-linejoin:round}
@keyframes pulsa{50%{opacity:.35}}
.pulsa{animation:pulsa 1.4s ease-in-out infinite}
</style>
</head>
